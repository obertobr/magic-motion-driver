name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: Windows x64
            binary_name: magic-motion-windows-x64.exe
          - target: i686-pc-windows-msvc
            name: Windows x86 (32-bit)
            binary_name: magic-motion-windows-x86.exe
          - target: aarch64-pc-windows-msvc
            name: Windows ARM64
            binary_name: magic-motion-windows-arm64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Prepare binary artifact
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/magic-motion.exe" "${{ matrix.binary_name }}"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.binary_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
